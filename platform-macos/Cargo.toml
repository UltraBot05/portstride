[package]
name = "portstride-platform-macos"
version = "0.1.0"
edition = "2024"

[dependencies]
portstride-engine = { path = "../engine" }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "1.1.3", features = ["fs", "process"] }
sha2 = "0.10"
getrandom = "0.2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
serde_json = "1"
