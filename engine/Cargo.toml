[package]
name = "portstride-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
getrandom = "0.2"
rustix = { version = "1.1.3", features = ["process"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.3", features = ["fs"] }
