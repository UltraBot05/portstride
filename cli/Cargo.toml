[package]
name = "portstride"
version = "0.1.0"
edition = "2024"
default-run = "portstride"

[dependencies]
portstride-engine = { path = "../engine" }
portstride-platform-macos = { path = "../platform-macos" }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.3", features = ["fs", "process"] }

[dev-dependencies]
getrandom = "0.2"
